<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>Resolve Recovery</title>

<link rel="stylesheet" href="./blocked.css"/>

</head>

<body>

<div class="background"></div>

<div class="container">

    <div class="logo">

        🛡

    </div>

    <h1>

        Resolve

    </h1>

    <h2>

        You chose recovery.

    </h2>

    <p class="subtitle">

        Every urge resisted rewires your brain.

    </p>


    <div class="breathing">

        <div id="circle"></div>

        <p id="breathingText">

            Breathe In

        </p>

    </div>


    <div class="stats">

        <div class="card">

            <span>🔥</span>

            <h3 id="streak">

                0

            </h3>

            <p>Recovery Days</p>

        </div>

        <div class="card">

            <span>💰</span>

            <h3 id="saved">

                KES 0

            </h3>

            <p>Money Saved</p>

        </div>

        <div class="card">

            <span>⏱</span>

            <h3 id="blocked">

                0

            </h3>

            <p>Blocks Today</p>

        </div>

    </div>


    <blockquote id="quote">

        One decision today changes tomorrow.

    </blockquote>


    <div class="buttons">

        <button id="coach">

            Talk to AI Coach

        </button>

        <button id="back">

            Go Back

        </button>

    </div>

</div>

<script type="module" src="./blocked.js"></script>

</body>

</html>
